<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fly Visuals Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f2ef; --panel:#fff; --ink:#16181d; --muted:#6b6f78; --line:#e2e0db;
  --accent:#e8501c; --accent-ink:#fff; --col:#ebe9e4; --good:#1f8a4c; --warn:#c77700; --bad:#c62828;
  --chip:#f0eee9; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121417; --panel:#1b1e23; --ink:#eceff3; --muted:#9097a1; --line:#2b3037;
  --col:#171a1e; --chip:#262a31; --shadow:0 1px 2px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
h1,h2,h3,.brand{font-family:"Barlow Condensed",Inter,sans-serif;letter-spacing:.02em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px;font-weight:500}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* top bar */
header{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:5;flex-wrap:wrap}
@media (prefers-color-scheme: dark){header{background:#0b0c0e;border-bottom:1px solid var(--line)}}
.brand{font-size:22px}.brand b{color:var(--accent)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:#c9ccd2;padding:8px 12px;border-radius:8px;cursor:pointer;font-weight:600}
nav button.on{background:rgba(255,255,255,.12);color:#fff}
.who{margin-left:auto;display:flex;gap:10px;align-items:center;color:#c9ccd2;font-size:13px}
.who button{background:none;border:1px solid #444;color:#c9ccd2;border-radius:6px;padding:4px 8px;cursor:pointer}
main{padding:16px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar h2{font-size:26px;margin-right:auto}
.toolbar input,.toolbar select{width:auto;min-width:160px}

/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{background:var(--col);border-radius:12px;min-width:250px;width:250px;flex:0 0 auto;padding:10px;border:1px solid var(--line)}
.col h3{font-size:17px;display:flex;justify-content:space-between;margin:2px 4px 10px}
.col h3 span{color:var(--muted);font-family:Inter;font-size:12px;font-weight:600}
.col .drop{min-height:60px;display:flex;flex-direction:column;gap:8px}
.col.over{outline:2px dashed var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;box-shadow:var(--shadow)}
.card:hover{border-color:var(--muted)}
.card .t{font-weight:600;margin-bottom:2px}
.card .s{font-size:12px;color:var(--muted)}
.card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;background:var(--chip);border-radius:20px;padding:2px 8px;font-weight:600}
.tag.ghl{background:#e8501c22;color:var(--accent)}
.tag.date{background:#1f8a4c22;color:var(--good)}
.tag.late{background:#c6282822;color:var(--bad)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}
.modal{background:var(--panel);border-radius:14px;width:100%;max-width:820px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal h2{font-size:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-top:16px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
.feed{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px}
.feed div{padding:6px 2px;border-bottom:1px solid var(--line)}
.feed div:last-child{border:0}
.feed small{color:var(--muted)}
.row{display:flex;gap:8px;align-items:end}
.section{margin-top:16px}
.section h3{font-size:18px;margin-bottom:8px}

/* calendar */
.cal{display:grid;grid-template-columns:110px repeat(7,minmax(120px,1fr));border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--panel)}
.cal>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;min-height:90px}
.cal .hd{min-height:auto;background:var(--col);font-weight:600;font-size:13px;text-align:center}
.cal .hd.today{color:var(--accent)}
.cal .bay{background:var(--col);font-weight:600;font-size:13px;display:flex;align-items:center}
.cal .cell{display:flex;flex-direction:column;gap:6px}
.cal .cell.over{background:#e8501c14}
.cal .card{padding:6px 8px;font-size:12px}
.callay{display:grid;grid-template-columns:1fr 240px;gap:14px}
@media (max-width:900px){.callay{grid-template-columns:1fr}}
.unsched{background:var(--col);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;align-self:start}

/* quote */
.qwrap{display:grid;grid-template-columns:1fr 360px;gap:20px}
@media (max-width:900px){.qwrap{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.lines{width:100%;border-collapse:collapse}
.lines td{padding:6px 0;border-bottom:1px solid var(--line)}
.lines td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.total{font-family:"Barlow Condensed",Inter,sans-serif;font-weight:700;font-size:40px;margin-top:10px}
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg button{flex:1}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* tables */
table.data{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.data th{text-align:left;font-size:12px;color:var(--muted);background:var(--col);padding:8px}
table.data td{padding:6px 8px;border-top:1px solid var(--line)}
table.data td input,table.data td select{padding:5px 7px}
tr.low td{background:#c6282812}
.pill{font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px}
.pill.low{background:#c6282822;color:var(--bad)}
.pill.ok{background:#1f8a4c22;color:var(--good)}
.scroll{overflow-x:auto}

/* login */
.login{max-width:360px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px}
.login .brand{font-size:32px;color:var(--ink)}
.err{color:var(--bad);font-size:13px}
code.box{display:block;background:var(--chip);padding:8px 10px;border-radius:8px;word-break:break-all;font-size:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;font-weight:600}
</style>
</head>
<body>
<div id="login" class="login hidden">
  <div class="brand">FLY <b>VISUALS</b> SHOP</div>
  <div><label>Your name</label><input id="lname" placeholder="e.g. Brian"></div>
  <div><label>Shop password</label><input id="lpass" type="password"></div>
  <button class="btn primary" id="lgo">Sign in</button>
  <div class="err" id="lerr"></div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="brand">FLY <b>VISUALS</b> SHOP</div>
    <nav id="nav">
      <button data-v="board" class="on">Job Board</button>
      <button data-v="cal">Install Calendar</button>
      <button data-v="quote">Quote</button>
      <button data-v="mat">Materials</button>
      <button data-v="set">Settings</button>
    </nav>
    <div class="who"><span id="whoName"></span><button id="logout">Sign out</button></div>
  </header>
  <main id="view"></main>
</div>
<div id="modalRoot"></div>
<script src="app.js"></script>
</body>
</html>
